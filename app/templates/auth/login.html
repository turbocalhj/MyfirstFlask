{% extends "base.html" %}

{% block title %}登录 · {{ app_name }}{% endblock %}

{% block content %}
<div class="panel">
  <h1>登录</h1>
  <form method="post" class="form">
    <label>
      用户名
      <input name="username" required autofocus autocomplete="username" value="{{ request.form.get('username', '') }}">
    </label>
    <label>
      密码
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">登录</button>
      <a class="btn btn-ghost" href="{{ url_for('auth.register') }}">没有账号？注册</a>
    </div>
  </form>
</div>
{% endblock %}
